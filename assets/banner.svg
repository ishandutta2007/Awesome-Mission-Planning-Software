<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1f2937"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#f472b6"/></linearGradient><linearGradient id="orbit-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".8"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>.orbit-line{stroke:url(#orbit-grad);stroke-width:2;fill:none;stroke-dasharray:8 6;animation:rotateOrbit 40s linear infinite;transform-origin:600px 150px}.satellite{animation:pulseGlow 3s ease-in-out infinite alternate}.grid-line{stroke:#374151;stroke-width:.5;opacity:.3}</style><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g class="grid"><line x1="100" x2="100" y1="0" y2="300" class="grid-line"/><line x1="300" x2="300" y1="0" y2="300" class="grid-line"/><line x1="500" x2="500" y1="0" y2="300" class="grid-line"/><line x1="700" x2="700" y1="0" y2="300" class="grid-line"/><line x1="900" x2="900" y1="0" y2="300" class="grid-line"/><line x1="1100" x2="1100" y1="0" y2="300" class="grid-line"/><line x1="0" x2="1200" y1="75" y2="75" class="grid-line"/><line x1="0" x2="1200" y1="150" y2="150" class="grid-line"/><line x1="0" x2="1200" y1="225" y2="225" class="grid-line"/></g><ellipse cx="600" cy="150" class="orbit-line" rx="450" ry="110" transform="rotate(-12 600 150)"/><ellipse cx="600" cy="150" class="orbit-line" rx="520" ry="90" transform="rotate(18 600 150)"/><g class="